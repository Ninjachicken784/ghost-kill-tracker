name: Build Mod
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: List files
        run: find . -name "gradlew" -o -name "build.gradle" | head -20
      - name: Grant execute permission for gradlew
        run: find . -name "gradlew" -exec chmod +x {} \;
      - name: Build with Gradle
        run: |
          BUILD_DIR=$(find . -name "build.gradle" | head -1 | xargs dirname)
          echo "Building in $BUILD_DIR"
          cd $BUILD_DIR && ./gradlew build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ghost-kill-tracker-jar
          path: "**/build/libs/*[^sources].jar"
